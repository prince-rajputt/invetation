<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600" width="1440" height="1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ornate golden mandala with a sacred toran arch, lotus blooms and floating petals">
  <defs>
    <!-- Radiant sunrise field -->
    <radialGradient id="sky" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="34%" stop-color="#FBEFD6"/>
      <stop offset="62%" stop-color="#F6E3CA"/>
      <stop offset="82%" stop-color="#F3D9C6"/>
      <stop offset="100%" stop-color="#F1CFC2"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C1D24" stop-opacity="0.10"/>
      <stop offset="18%" stop-color="#7C2B33" stop-opacity="0"/>
      <stop offset="78%" stop-color="#FBF6EC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FBF6EC" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5DE9B" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#E7C878" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E7C878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D59C"/>
      <stop offset="55%" stop-color="#E7C878"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
    <linearGradient id="goldPetalDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C878"/>
      <stop offset="100%" stop-color="#A67C28"/>
    </linearGradient>
    <radialGradient id="bindu" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="45%" stop-color="#E7C878"/>
      <stop offset="100%" stop-color="#A67C28"/>
    </radialGradient>
    <linearGradient id="lotusPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBEAE6"/>
      <stop offset="60%" stop-color="#F3D2CE"/>
      <stop offset="100%" stop-color="#E5A6A6"/>
    </linearGradient>

    <!-- One outer mandala petal, tip up, centred on (720,690) -->
    <path id="pOuter" d="M720 460 C686 388 686 322 720 282 C754 322 754 388 720 460 Z"/>
    <!-- Mid petal -->
    <path id="pMid" d="M720 512 C700 472 700 446 720 470 C740 446 740 472 720 512 Z"/>
    <!-- Inner lotus petal -->
    <path id="pLotus" d="M720 636 C692 604 692 552 720 520 C748 552 748 604 720 636 Z"/>
    <!-- Ray -->
    <path id="ray" d="M718 300 L722 300 L720 40 Z"/>
    <!-- Small marigold -->
    <g id="marigold">
      <circle r="13" fill="url(#goldPetalDeep)"/>
      <circle r="13" fill="none" stroke="#A67C28" stroke-width="1.2" stroke-dasharray="2 3"/>
      <circle r="5" fill="#FBF6EC" opacity="0.85"/>
    </g>
    <!-- Hanging bud -->
    <g id="bud">
      <path d="M0 0 C-9 14 -9 30 0 40 C9 30 9 14 0 0 Z" fill="url(#lotusPink)" stroke="#C9757C" stroke-width="1" opacity="0.9"/>
      <circle cy="-4" r="3.5" fill="#C9A24B"/>
    </g>
    <!-- Lotus bloom -->
    <g id="lotus">
      <path d="M0 6 C-58 6 -104 -22 -120 -30 C-96 -6 -60 12 0 12 C60 12 96 -6 120 -30 C104 -22 58 6 0 6 Z" fill="#7C8C6A" opacity="0.35"/>
      <path d="M0 8 C-22 8 -40 -30 -30 -66 C-16 -40 -6 -18 0 -6 C6 -18 16 -40 30 -66 C40 -30 22 8 0 8 Z" fill="url(#lotusPink)" stroke="#C9757C" stroke-width="1" opacity="0.92"/>
      <path d="M0 8 C-16 6 -30 -26 -24 -54 C-12 -30 -4 -14 0 -6 C4 -14 12 -30 24 -54 C30 -26 16 6 0 8 Z" fill="#FBEAE6" opacity="0.9"/>
      <path d="M0 8 C-8 4 -14 -22 -8 -44 C-3 -24 0 -14 0 -8 C0 -14 3 -24 8 -44 C14 -22 8 4 0 8 Z" fill="#F3D2CE"/>
      <circle cy="-8" r="6" fill="url(#bindu)"/>
    </g>
  </defs>

  <!-- Background field -->
  <rect width="1440" height="1600" fill="url(#sky)"/>

  <!-- God-rays behind the mandala -->
  <g opacity="0.16" fill="#E7C878">
    <use href="#ray"/>
    <use href="#ray" transform="rotate(30 720 690)"/>
    <use href="#ray" transform="rotate(60 720 690)"/>
    <use href="#ray" transform="rotate(90 720 690)"/>
    <use href="#ray" transform="rotate(120 720 690)"/>
    <use href="#ray" transform="rotate(150 720 690)"/>
    <use href="#ray" transform="rotate(180 720 690)"/>
    <use href="#ray" transform="rotate(210 720 690)"/>
    <use href="#ray" transform="rotate(240 720 690)"/>
    <use href="#ray" transform="rotate(270 720 690)"/>
    <use href="#ray" transform="rotate(300 720 690)"/>
    <use href="#ray" transform="rotate(330 720 690)"/>
  </g>

  <!-- Divine halo glow -->
  <circle cx="720" cy="690" r="470" fill="url(#halo)"/>

  <!-- MANDALA -->
  <g stroke-linejoin="round">
    <!-- Outer decorative rings -->
    <circle cx="720" cy="690" r="452" fill="none" stroke="#C9A24B" stroke-width="1.4" opacity="0.55"/>
    <circle cx="720" cy="690" r="444" fill="none" stroke="#A67C28" stroke-width="2" opacity="0.5" stroke-dasharray="1.5 13"/>
    <circle cx="720" cy="690" r="214" fill="none" stroke="#C9A24B" stroke-width="1.2" opacity="0.6"/>
    <circle cx="720" cy="690" r="200" fill="none" stroke="#A67C28" stroke-width="1" opacity="0.45" stroke-dasharray="1.5 9"/>

    <!-- Outer petals (16) -->
    <g fill="url(#goldPetal)" stroke="#A67C28" stroke-width="1" opacity="0.92">
      <use href="#pOuter"/>
      <use href="#pOuter" transform="rotate(22.5 720 690)"/>
      <use href="#pOuter" transform="rotate(45 720 690)"/>
      <use href="#pOuter" transform="rotate(67.5 720 690)"/>
      <use href="#pOuter" transform="rotate(90 720 690)"/>
      <use href="#pOuter" transform="rotate(112.5 720 690)"/>
      <use href="#pOuter" transform="rotate(135 720 690)"/>
      <use href="#pOuter" transform="rotate(157.5 720 690)"/>
      <use href="#pOuter" transform="rotate(180 720 690)"/>
      <use href="#pOuter" transform="rotate(202.5 720 690)"/>
      <use href="#pOuter" transform="rotate(225 720 690)"/>
      <use href="#pOuter" transform="rotate(247.5 720 690)"/>
      <use href="#pOuter" transform="rotate(270 720 690)"/>
      <use href="#pOuter" transform="rotate(292.5 720 690)"/>
      <use href="#pOuter" transform="rotate(315 720 690)"/>
      <use href="#pOuter" transform="rotate(337.5 720 690)"/>
    </g>

    <!-- Mid petals (16), interleaved -->
    <g transform="rotate(11.25 720 690)" fill="#F3D2CE" stroke="#C9A24B" stroke-width="0.8" opacity="0.7">
      <use href="#pMid"/>
      <use href="#pMid" transform="rotate(22.5 720 690)"/>
      <use href="#pMid" transform="rotate(45 720 690)"/>
      <use href="#pMid" transform="rotate(67.5 720 690)"/>
      <use href="#pMid" transform="rotate(90 720 690)"/>
      <use href="#pMid" transform="rotate(112.5 720 690)"/>
      <use href="#pMid" transform="rotate(135 720 690)"/>
      <use href="#pMid" transform="rotate(157.5 720 690)"/>
      <use href="#pMid" transform="rotate(180 720 690)"/>
      <use href="#pMid" transform="rotate(202.5 720 690)"/>
      <use href="#pMid" transform="rotate(225 720 690)"/>
      <use href="#pMid" transform="rotate(247.5 720 690)"/>
      <use href="#pMid" transform="rotate(270 720 690)"/>
      <use href="#pMid" transform="rotate(292.5 720 690)"/>
      <use href="#pMid" transform="rotate(315 720 690)"/>
      <use href="#pMid" transform="rotate(337.5 720 690)"/>
    </g>

    <!-- Inner lotus (8) -->
    <g fill="url(#goldPetal)" stroke="#A67C28" stroke-width="1" opacity="0.95">
      <use href="#pLotus"/>
      <use href="#pLotus" transform="rotate(45 720 690)"/>
      <use href="#pLotus" transform="rotate(90 720 690)"/>
      <use href="#pLotus" transform="rotate(135 720 690)"/>
      <use href="#pLotus" transform="rotate(180 720 690)"/>
      <use href="#pLotus" transform="rotate(225 720 690)"/>
      <use href="#pLotus" transform="rotate(270 720 690)"/>
      <use href="#pLotus" transform="rotate(315 720 690)"/>
    </g>

    <!-- Centre bindu -->
    <circle cx="720" cy="690" r="46" fill="url(#bindu)" stroke="#A67C28" stroke-width="1.5"/>
    <circle cx="720" cy="690" r="20" fill="#7C2B33" opacity="0.9"/>
    <circle cx="712" cy="682" r="7" fill="#FBF6EC" opacity="0.7"/>
  </g>

  <!-- Peacock feather crown accents above the mandala -->
  <g transform="translate(720 232)" opacity="0.9">
    <g transform="rotate(-16)">
      <path d="M0 0 C-6 -70 -6 -150 0 -210" fill="none" stroke="#5C6B4C" stroke-width="3"/>
      <ellipse cx="0" cy="-214" rx="16" ry="24" fill="#25406B"/>
      <ellipse cx="0" cy="-214" rx="9" ry="15" fill="#7C8C6A"/>
      <circle cx="0" cy="-210" r="5" fill="#A67C28"/>
    </g>
    <g transform="rotate(16)">
      <path d="M0 0 C6 -70 6 -150 0 -210" fill="none" stroke="#5C6B4C" stroke-width="3"/>
      <ellipse cx="0" cy="-214" rx="16" ry="24" fill="#25406B"/>
      <ellipse cx="0" cy="-214" rx="9" ry="15" fill="#7C8C6A"/>
      <circle cx="0" cy="-210" r="5" fill="#A67C28"/>
    </g>
    <path d="M0 4 C-6 -60 -6 -140 0 -196" fill="none" stroke="#5C6B4C" stroke-width="3.5"/>
    <ellipse cx="0" cy="-200" rx="18" ry="27" fill="#1B2E4E"/>
    <ellipse cx="0" cy="-200" rx="10" ry="17" fill="#25406B"/>
    <ellipse cx="0" cy="-200" rx="5" ry="9" fill="#7C8C6A"/>
    <circle cx="0" cy="-195" r="4.5" fill="#E7C878"/>
  </g>

  <!-- TORAN — scalloped garland arch across the top -->
  <g>
    <path d="M40 96 Q120 96 130 150 Q140 96 220 96 Q300 96 310 150 Q320 96 400 96 Q480 96 490 150 Q500 96 580 96 Q660 96 670 150 Q680 96 760 96 Q840 96 850 150 Q860 96 940 96 Q1020 96 1030 150 Q1040 96 1120 96 Q1200 96 1210 150 Q1220 96 1300 96 Q1380 96 1400 96"
          fill="none" stroke="#C9A24B" stroke-width="3" opacity="0.7"/>
    <use href="#marigold" transform="translate(130 150)"/>
    <use href="#marigold" transform="translate(310 150)"/>
    <use href="#marigold" transform="translate(490 150)"/>
    <use href="#marigold" transform="translate(670 150)"/>
    <use href="#marigold" transform="translate(850 150)"/>
    <use href="#marigold" transform="translate(1030 150)"/>
    <use href="#marigold" transform="translate(1210 150)"/>
    <!-- Hanging strands with buds -->
    <g stroke="#C9A24B" stroke-width="1.4" opacity="0.65">
      <line x1="220" y1="98" x2="220" y2="176"/>
      <line x1="580" y1="98" x2="580" y2="210"/>
      <line x1="760" y1="98" x2="760" y2="210"/>
      <line x1="1120" y1="98" x2="1120" y2="176"/>
    </g>
    <use href="#bud" transform="translate(220 176)"/>
    <use href="#bud" transform="translate(580 210)"/>
    <use href="#bud" transform="translate(760 210)"/>
    <use href="#bud" transform="translate(1120 176)"/>
  </g>

  <!-- Lotus pond at the base -->
  <g opacity="0.95">
    <path d="M0 1500 Q360 1470 720 1490 Q1080 1470 1440 1500 L1440 1600 L0 1600 Z" fill="#F3D9C6" opacity="0.5"/>
    <use href="#lotus" transform="translate(720 1470) scale(1.15)"/>
    <use href="#lotus" transform="translate(430 1500) scale(0.85)"/>
    <use href="#lotus" transform="translate(1010 1500) scale(0.9)"/>
    <use href="#lotus" transform="translate(220 1520) scale(0.6)" opacity="0.8"/>
    <use href="#lotus" transform="translate(1220 1520) scale(0.65)" opacity="0.8"/>
  </g>

  <!-- Floating petals & sparkles -->
  <g fill="#E5A6A6" opacity="0.55">
    <path d="M300 420 C292 430 292 444 300 452 C308 444 308 430 300 420 Z"/>
    <path d="M1150 360 C1142 370 1142 384 1150 392 C1158 384 1158 370 1150 360 Z"/>
    <path d="M260 900 C252 910 252 924 260 932 C268 924 268 910 260 900 Z"/>
    <path d="M1180 940 C1172 950 1172 964 1180 972 C1188 964 1188 950 1180 940 Z"/>
    <path d="M520 250 C512 260 512 274 520 282 C528 274 528 260 520 250 Z"/>
    <path d="M980 260 C972 270 972 284 980 292 C988 284 988 270 980 260 Z"/>
  </g>
  <g fill="#E7C878">
    <circle cx="180" cy="560" r="3.5" opacity="0.7"/>
    <circle cx="1270" cy="620" r="3.5" opacity="0.7"/>
    <circle cx="360" cy="1120" r="3" opacity="0.6"/>
    <circle cx="1090" cy="1130" r="3" opacity="0.6"/>
    <circle cx="240" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="1210" cy="280" r="2.5" opacity="0.6"/>
    <circle cx="640" cy="180" r="2.5" opacity="0.5"/>
    <circle cx="820" cy="200" r="2.5" opacity="0.5"/>
  </g>

  <!-- Soft vertical veil for text legibility + bottom blend to ivory -->
  <rect width="1440" height="1600" fill="url(#veil)"/>
</svg>
